<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>Tebo Studio's</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bk:#0e0d0b;--g:#c49a45;--gl:#e8c97a;--gd:#c49a4512;--gm:#c49a4530;--sf:#f8f6f2;--cd:#fff;--br:#e6e2d8;--bs:#cdc8b8;--tx:#1a1814;--t2:#58544a;--t3:#9a9080;--gn:#1a7a52;--gnb:#f0faf5;--gnbd:#b7e0cc;--rd:#c0392b;--rdb:#fff5f5;--rdbd:#f5b8b0;--am:#b45309;--amb:#fffbeb;--wa:#25D366;--pr:#6b21a8;--prd:#6b21a810}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--sf);color:var(--tx);font-size:14px;-webkit-tap-highlight-color:transparent}
.hdr{background:var(--bk);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:10px}
.lr{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--g);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lr span{font-family:'Cormorant Garamond',serif;font-size:13px;color:var(--g)}
.ln{font-family:'Cormorant Garamond',serif;font-size:14px;color:#fff;letter-spacing:.08em}
.ls{font-size:8px;color:var(--g);letter-spacing:.18em;text-transform:uppercase}
.hb{font-family:'DM Mono',monospace;font-size:10px;color:var(--t3);background:#fff1;padding:3px 8px;border-radius:5px;border:1px solid #fff2}
.type-bar{display:flex;background:var(--cd);border-bottom:1px solid var(--br);padding:6px 16px;gap:6px}
.type-btn{flex:1;padding:10px;border:1.5px solid var(--br);border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;background:#fff;color:var(--t2);font-family:'DM Sans',sans-serif;text-align:center;transition:all .15s}
.type-btn.ev-on{border-color:var(--g);background:var(--gd);color:var(--bk)}
.type-btn.st-on{border-color:var(--pr);background:var(--prd);color:var(--pr)}
.tabs{display:flex;background:var(--cd);border-bottom:1px solid var(--br);padding:0 16px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{padding:9px 13px;font-size:11px;font-weight:600;color:var(--t3);border:none;background:transparent;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap;border-bottom:2.5px solid transparent;transition:all .15s}
.tab.on{color:var(--g);border-bottom-color:var(--g)}
.main{padding:14px 16px;max-width:900px;margin:0 auto}
.fc{background:var(--cd);border:1px solid var(--br);border-radius:12px;overflow:hidden;box-shadow:0 2px 10px #0e0d0b06;margin-bottom:14px}
.fc-hdr{padding:14px 16px;border-bottom:1px solid var(--br);background:var(--sf)}
.fc-hdr h3{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:500}
.fc-body{padding:14px 16px}
.f{margin-bottom:10px}
.f label{display:block;font-size:10px;font-weight:700;color:var(--t2);letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--bs);border-radius:7px;padding:8px 10px;font-size:13px;color:var(--tx);background:#fff;font-family:'DM Sans',sans-serif}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 3px var(--gd)}
.f textarea{resize:none;line-height:1.5}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.id-box{background:var(--gd);border:1px dashed var(--gm);border-radius:8px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.id-val{font-family:'DM Mono',monospace;font-size:13px;color:var(--bk);font-weight:600}
.id-err{background:var(--rdb);border:1px solid var(--rdbd);border-radius:6px;padding:6px 10px;font-size:11px;color:var(--rd);font-weight:600;margin-top:4px}
.id-toggle{display:flex;gap:5px;margin-bottom:8px}
.id-toggle button{flex:1;padding:7px;border:1.5px solid var(--bs);border-radius:7px;font-size:11px;font-weight:700;cursor:pointer;background:#fff;color:var(--t2);font-family:'DM Sans',sans-serif}
.id-toggle button.on{border-color:var(--g);background:var(--gd);color:var(--bk)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.chip{display:flex;align-items:center;gap:4px;padding:5px 9px;border:1px solid var(--bs);border-radius:6px;cursor:pointer;background:#fff;font-size:12px;font-weight:500;transition:all .12s}
.chip.on{border-color:var(--g);background:var(--gd)}
.chip input{accent-color:var(--g);width:11px;height:11px}
.se-block{border:1px solid var(--br);border-radius:8px;padding:12px;margin-bottom:8px;background:var(--sf);position:relative}
.se-rm{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;border:1px solid #fecaca;background:#fff;color:var(--rd);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.pkg-card{border:1px solid var(--br);border-radius:8px;padding:10px 12px;cursor:pointer;transition:all .15s;background:#fff;margin-bottom:6px}
.pkg-card:hover{border-color:var(--g)}
.pkg-card.sel{border-color:var(--g);background:var(--gd);box-shadow:0 0 0 2px var(--gm)}
.pkg-name{font-size:13px;font-weight:600;color:var(--tx)}
.pkg-price{font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--g);font-weight:500}
.pkg-reqs{font-size:11px;color:var(--t2);margin-top:2px}
.qbox{background:var(--amb);border:1px solid #fde68a;border-radius:8px;padding:12px;margin-bottom:12px}
.qbox .ql{font-size:10px;font-weight:700;color:var(--am);letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px}
.qconf{background:var(--gnb);border:1px solid var(--gnbd);border-radius:7px;padding:8px 12px;font-size:12px;font-weight:600;color:var(--gn);margin-top:6px}
.ablock{border:1px solid var(--br);border-radius:8px;padding:10px;margin-bottom:8px;background:var(--sf)}
.albl{font-size:10px;font-weight:700;color:var(--t3);letter-spacing:.07em;text-transform:uppercase;margin-bottom:6px}
.meths{display:flex;gap:4px;margin-top:5px}
.meth{padding:4px 10px;border:1px solid var(--bs);border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;background:#fff;color:var(--t2);font-family:'DM Sans',sans-serif}
.meth.on{background:var(--g);border-color:var(--g);color:#fff}
.trow{display:flex;gap:6px;margin-bottom:8px}
.tog{flex:1;padding:8px;border:1px solid var(--bs);border-radius:7px;font-size:11px;font-weight:600;cursor:pointer;background:#fff;color:var(--t2);font-family:'DM Sans',sans-serif;text-align:center;transition:all .15s}
.tog.g{border-color:var(--gnbd);background:var(--gnb);color:var(--gn)}
.tog.r{border-color:var(--rdbd);background:var(--rdb);color:var(--rd)}
.team-row{display:grid;grid-template-columns:1fr 1fr 80px 80px 28px;gap:5px;align-items:center;padding:7px;border:1px solid var(--br);border-radius:7px;background:var(--sf);margin-bottom:5px}
.team-row select,.team-row input{border:1px solid var(--bs);border-radius:5px;padding:5px 7px;font-size:12px;font-family:'DM Sans',sans-serif;width:100%}
.rm{width:22px;height:22px;border-radius:50%;border:1px solid #fecaca;background:#fff;color:var(--rd);font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.add-btn{padding:6px 12px;border:1px solid var(--g);border-radius:6px;background:var(--gd);color:var(--bk);font-size:11px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif}
.dl{border:1px solid var(--bs);border-radius:8px;overflow:hidden;margin-bottom:8px}
.di{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--br)}
.di:last-child{border-bottom:none}
.di-n{font-family:'DM Mono',monospace;font-size:10px;color:var(--t3);min-width:14px}
.di input[type=text]{flex:1;border:none;font-size:12px;color:var(--tx);font-family:'DM Sans',sans-serif;background:transparent;outline:none}
.di-chk{width:13px;height:13px;accent-color:var(--gn);cursor:pointer}
.btn-row{display:flex;gap:7px;margin-top:14px}
.btn-p{flex:1;padding:10px;background:var(--bk);color:#fff;border:none;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif}
.btn-s{flex:1;padding:10px;border:1px solid var(--bs);border-radius:7px;background:#fff;color:var(--t2);font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif}
.btn-save{width:100%;padding:12px;background:var(--g);color:var(--bk);border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Cormorant Garamond',serif;letter-spacing:.05em;margin-top:10px}
/* DASHBOARD */
.dash-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.dcard{background:var(--cd);border:1px solid var(--br);border-radius:9px;padding:10px 12px;box-shadow:0 1px 6px #0e0d0b06}
.dv{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:400;line-height:1}
.dv.gold{color:var(--g)}.dv.red{color:var(--rd)}
.dl2{font-size:10px;color:var(--t3);margin-top:2px}
.alert-list{margin-bottom:14px}
.alert-item{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--cd);border:1px solid var(--br);border-radius:8px;margin-bottom:5px}
.alert-item.warn{border-color:#fde68a;background:var(--amb)}
.alert-item.danger{border-color:var(--rdbd);background:var(--rdb)}
.alert-name{font-size:13px;font-weight:600}.alert-meta{font-size:11px;color:var(--t3)}
.alert-amt{font-size:12px;font-weight:700;color:var(--rd)}
/* SEARCH BAR */
.sbar{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.sbar input,.sbar select{flex:1;min-width:100px;border:1px solid var(--bs);border-radius:7px;padding:7px 10px;font-size:12px;background:#fff;color:var(--tx);font-family:'DM Sans',sans-serif}
.sbar input:focus,.sbar select:focus{outline:none;border-color:var(--g)}
.ibtn{padding:6px 12px;border:1px solid var(--bs);border-radius:7px;background:#fff;color:var(--t2);font-size:11px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap}
.ibtn:hover{border-color:var(--g);color:var(--g)}
/* ORDER CARD */
.ol{display:flex;flex-direction:column;gap:10px}
.oc{background:var(--cd);border:1px solid var(--br);border-radius:10px;overflow:hidden;box-shadow:0 1px 6px #0e0d0b06}
.oct{padding:10px 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;border-bottom:1px solid var(--br)}
.oc-id{font-family:'DM Mono',monospace;font-size:10px;color:var(--t3);background:var(--sf);padding:2px 6px;border-radius:4px;border:1px solid var(--br);display:inline-block;margin-bottom:2px}
.oc-name{font-size:14px;font-weight:600}
.oc-meta{font-size:11px;color:var(--t3);margin-top:1px}
.stb{padding:3px 8px;border-radius:99px;font-size:10px;font-weight:700;white-space:nowrap}
.s-new{background:#f0f4ff;color:#3b5bdb}.s-conf{background:var(--amb);color:var(--am)}
.s-prog{background:var(--gnb);color:var(--gn)}.s-del{background:#ede9fe;color:var(--pr)}.s-done{background:#e8f5e9;color:#2e7d32}
.pills{display:flex;gap:4px;padding:8px 14px;border-bottom:1px solid var(--br);flex-wrap:wrap}
.ip{display:flex;align-items:center;gap:3px;padding:2px 7px;border-radius:99px;font-size:9px;font-weight:700;border:1px solid transparent}
.ip.r{background:var(--rdb);border-color:var(--rdbd);color:var(--rd)}
.ip.g{background:var(--gnb);border-color:var(--gnbd);color:var(--gn)}
.ip .d{width:5px;height:5px;border-radius:50%;background:currentColor}
.ocg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:8px 14px;border-bottom:1px solid var(--br)}
.oil{font-size:9px;color:var(--t3);margin-bottom:1px}.oiv{font-size:11px;font-weight:500}
.msgs{padding:8px 14px;display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--br)}
.mb{padding:4px 8px;border-radius:6px;font-size:10px;font-weight:600;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;white-space:nowrap}
.mb-g{background:#e8f5ee;color:var(--gn)}.mb-g:hover{background:var(--wa);color:#fff}
.mb-a{background:#fef9c3;color:#854d0e}.mb-a:hover{background:#ca8a04;color:#fff}
.mb-p{background:#ede9fe;color:var(--pr)}.mb-p:hover{background:var(--pr);color:#fff}
.mb-r{background:#fff0f0;color:var(--rd)}.mb-r:hover{background:var(--rd);color:#fff}
.mb-b{background:#e0f0ff;color:#1e5a9e}.mb-b:hover{background:#1e5a9e;color:#fff}
.ocf{padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.stsel{border:1px solid var(--bs);border-radius:6px;padding:4px 7px;font-size:11px;font-weight:600;color:var(--t2);background:#fff;font-family:'DM Sans',sans-serif;cursor:pointer}
.dbtn{padding:4px 8px;border:1px solid #fecaca;border-radius:6px;background:#fff;color:var(--rd);font-size:10px;cursor:pointer;font-family:'DM Sans',sans-serif}
.rp{font-size:9px;padding:3px 7px;border-radius:99px;background:var(--amb);color:var(--am);font-weight:700;border:1px solid #fde68a;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.modal-bg{position:fixed;inset:0;background:#0e0d0b80;z-index:200;display:flex;align-items:center;justify-content:center;padding:14px}
.modal-bg.hidden{display:none}
.modal{background:#fff;border-radius:14px;width:100%;max-width:520px;overflow:hidden;box-shadow:0 16px 48px #0e0d0b22;max-height:90vh;overflow-y:auto}
.mhdr{padding:12px 16px;background:var(--bk);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0}
.mt{font-family:'Cormorant Garamond',serif;font-size:15px;color:#fff}.mc{background:none;border:none;color:var(--t3);font-size:18px;cursor:pointer}
.mbody{padding:14px 16px}
.chtabs{display:flex;gap:4px;margin-bottom:10px}
.ch{padding:5px 11px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--bs);background:#fff;color:var(--t2);font-family:'DM Sans',sans-serif}
.ch.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.ch.sms{background:#3b5bdb;border-color:#3b5bdb;color:#fff}
.ch.em{background:#e65100;border-color:#e65100;color:#fff}
.mprev{background:var(--sf);border:1px solid var(--bs);border-radius:8px;padding:11px;font-size:12px;color:var(--tx);line-height:1.6;white-space:pre-wrap;max-height:220px;overflow-y:auto;font-family:'DM Sans',sans-serif}
.mft{display:flex;gap:7px;margin-top:10px}
.sbtn{flex:1;padding:10px;border-radius:7px;border:none;font-size:13px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif}
.sbtn.wa{background:var(--wa);color:#fff}.sbtn.sms{background:#3b5bdb;color:#fff}.sbtn.em{background:#e65100;color:#fff}
.cbtn{padding:10px 13px;border:1px solid var(--bs);border-radius:7px;background:#fff;color:var(--t2);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif}
.empty{text-align:center;padding:2.5rem 1rem;color:var(--t3)}
.empty h3{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:400;color:var(--t2);margin:8px 0 4px}
.toast{position:fixed;bottom:16px;right:16px;background:var(--bk);color:#fff;padding:8px 14px;border-radius:8px;font-size:12px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:300;display:flex;align-items:center;gap:6px}
.toast.show{opacity:1}
.tdot{width:6px;height:6px;border-radius:50%;background:var(--g)}
.day-badge{font-size:11px;color:var(--g);font-weight:600;margin-left:6px}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--bs);border-radius:2px}
@media(max-width:640px){.dash-cards{grid-template-columns:1fr 1fr}.team-row{grid-template-columns:1fr 1fr;gap:4px}.ocg{grid-template-columns:1fr 1fr}.frow{grid-template-columns:1fr}.f3{grid-template-columns:1fr 1fr 1fr}}
</style>
</head>

<div class="hdr">
  <div class="logo"><div class="lr"><span>TS</span></div><div><div class="ln">TEBO STUDIO'S</div><div class="ls">Order Management</div></div></div>

    </div>
  </div>
</div>

/* ═══ DASHBOARD ═══ */
function renderDashboard(el){
  const evOrders=orders.filter(o=>o.type!=='studio');
  const stOrders=orders.filter(o=>o.type==='studio');
  const filtered=mode==='event'?evOrders:stOrders;
  const totalRev=filtered.reduce((s,o)=>s+parseFloat(o.total||0),0);
  const pending=evOrders.filter(o=>{
    const bal=parseFloat(o.balance||0);
    const rec=parseFloat(o.received||0);
    const tot=parseFloat(o.total||0);
    return bal>0||(tot>0&&rec<tot*0.8);
  });
  const remDueCount=evOrders.filter(o=>remDue(o)).length;
  const overdue=evOrders.filter(o=>{
    if(o.status==='Complete')return false;
    const se=o.subEvents&&o.subEvents[0];
    const evd=o.evdate||se?.evdate||'';
    if(!evd)return false;
    const days=Math.floor((new Date()-new Date(evd))/864e5);
    return days>60&&o.type!=='studio';
  });

  el.innerHTML=`
    <div class="dash-cards">
      <div class="dcard"><div class="dv">${filtered.length}</div><div class="dl2">Total Orders</div></div>
      <div class="dcard"><div class="dv gold">\u20b9${totalRev.toLocaleString('en-IN')}</div><div class="dl2">Revenue</div></div>
      <div class="dcard"><div class="dv red">${pending.length}</div><div class="dl2">Payments Pending</div></div>
      <div class="dcard"><div class="dv">${remDueCount}</div><div class="dl2">Reminders Due</div></div>
    </div>
    ${pending.length?`<div class="fc"><div class="fc-hdr"><h3>💳 Payments Pending (${pending.length})</h3></div><div class="fc-body">
      ${pending.slice(0,15).map(o=>{
        const bal=parseFloat(o.balance||0);
        const rec=parseFloat(o.received||0);
        const tot=parseFloat(o.total||0);
        const pct=tot>0?Math.round(rec/tot*100):0;
        const isDanger=pct<80;
        return `<div class="alert-item${isDanger?' danger':' warn'}">
          <div><div class="alert-name">${o.name||'—'}</div><div class="alert-meta">${o.id} · ${o.status||'—'} · Paid ${pct}%</div></div>
          <div class="alert-amt">\u20b9${bal>0?bal.toLocaleString('en-IN'):(tot-rec).toLocaleString('en-IN')} due</div>
        </div>`;
      }).join('')}
    </div></div>`:''}
    ${overdue.length?`<div class="fc"><div class="fc-hdr"><h3>⚠️ Overdue (60+ days, ${overdue.length})</h3></div><div class="fc-body">
      ${overdue.slice(0,10).map(o=>{
        const se=o.subEvents&&o.subEvents[0]||{};
        const evd=o.evdate||se.evdate||'';
        const days=evd?Math.floor((new Date()-new Date(evd))/864e5):0;
        return `<div class="alert-item danger">
          <div><div class="alert-name">${o.name||'—'}</div><div class="alert-meta">${o.id} · ${days} days since event</div></div>
          <div class="alert-amt">${o.status||'—'}</div>
        </div>`;
      }).join('')}
    </div></div>`:''}`;
}

/* ═══ ID GENERATION ═══ */
function genId(){
  const n=new Date();const yy=String(n.getFullYear()).slice(2);
  const ml=ML[n.toLocaleString('en',{month:'short'})]||'A';
  const dd=String(n.getDate()).padStart(2,'0');
  const sfx=mode==='studio'?'S':'E';
  return `TEBO${yy}${ml}${dd}${sfx}${String(idCtr).padStart(3,'0')}`;
}

function checkDupId(id){return orders.some(o=>o.id===id);}

function saveStudio(){
  const name=document.getElementById('sf-name').value;
  if(!name){toast('Enter customer name');return;}
  const ph=document.getElementById('sf-phone').value;
  if(ph&&ph.length!==10){toast('Phone must be 10 digits');return;}
  const reqs=[...document.querySelectorAll('#stChips input:checked')].map(i=>i.value);
  const id=genId();
  if(checkDupId(id)){toast('ID already exists!');return;}
  const o={id,type:'studio',name,phone:'+91'+ph,odate:document.getElementById('sf-date').value,
    deldate:document.getElementById('sf-deldate').value,reqs,notes:document.getElementById('sf-notes').value,
    total:document.getElementById('sf-amt').value,status:document.getElementById('sf-status').value,
    savedAt:new Date().toISOString()};
  if(!Array.isArray(orders))orders=[];
  orders.unshift(o);localStorage.setItem(SK,JSON.stringify(orders));
  idCtr++;toast('Studio order saved!');renderStudioForm(document.getElementById('mainContent'));updateBadge();
  setTimeout(()=>openMsg(o,'studio_confirm'),500);
}

function calcFinal(){
  const q=parseFloat(document.getElementById('ef-quoted')?.value)||0;
  const d=parseFloat(document.getElementById('ef-disc')?.value)||0;
  const el=document.getElementById('ef-final');if(el)el.value=q>0?String(q-d):'';
}
function selM(btn,key){btn.closest('.meths').querySelectorAll('.meth').forEach(b=>b.classList.remove('on'));btn.classList.add('on');methState[key]=btn.textContent;}
function showDay(input,spanId){const d=new Date(input.value+'T00:00');const el=document.getElementById(spanId);if(el&&!isNaN(d))el.textContent=DAYS[d.getDay()];}
function checkId(input){
  const err=document.getElementById('idErr');
  if(checkDupId(input.value)){err.innerHTML='<div class="id-err">⚠️ This ID already exists!</div>';}
  else{err.innerHTML='';}
}

  const cc=document.getElementById('ef-cc')?.value||'+91';
  if(ph&&ph.length!==10){toast('Phone must be 10 digits');return;}
  const reqs=[...document.querySelectorAll('#reqChips input:checked')].map(i=>i.value);
  const dels=[...document.querySelectorAll('#delList .di')].map(r=>({
    text:r.querySelector('input[type=text]')?.value?.trim()||'',

    balance:document.getElementById('ef-bal')?.value||'',

    arrivedAtVenue:arrivedOk,photosCopied:photosOk,nasCopied:nasOk,
    smugShared:smugOk,smugLink:document.getElementById('ef-smuglink')?.value||'',
    pixShared:pixOk,pixLink:document.getElementById('ef-pixlink')?.value||'',

  idCtr++;toast('Event order saved!');resetFormState();curStep=0;

    payment:`Hi ${nm},\n\n\ud83d\udcb3 *Payment Details \u2014 Tebo Studio's*\n\nOrder: *${o.id}*\n\ud83d\udcb0 Final: *${final}*\n${a1?'\u2705 Advance 1: '+a1+'\n':''}\n\ud83d\udcb2 Balance: *${bal}*\n\nSmugMug: ${smugL}\nPixStudio: ${pixL}\n\n\ud83d\udcde +91 72000 05099\n\u2728 *Tebo Studio's*`,

function openMsg(o,trigger){
  mOrder=o;mTrigger=trigger;mCh='wa';
  const titles={booking:'\ud83d\udce9 Booking',quot_full:'\u2705 Quot+Req+Del',payment:'\ud83d\udcb3 Payment+Links',
    advance2:'\ud83d\udcb0 2nd Advance',reminder:'\u23f0 Reminder',pixstudio:'\ud83c\udf1f PixStudio',
    delivery:'\ud83d\udce6 Delivery',proof:'\ud83d\udcd6 Proof',studio_confirm:'\u2705 Confirmed',studio_ready:'\ud83c\udf89 Ready'};
  document.getElementById('msgTitle').textContent=titles[trigger]||'Send';
  swCh('wa');document.getElementById('msgModal').classList.remove('hidden');
}
function swCh(ch){
  mCh=ch;
  ['wa','sms','em'].forEach(c=>{document.getElementById('ch-'+c).className='ch'+(c===ch?' '+c:'');});
  document.getElementById('msgBody').textContent=buildMsg(mOrder,mTrigger);
  const btn=document.getElementById('sendBtn');
  btn.textContent=ch==='wa'?'Open WhatsApp \u2197':ch==='sms'?'Copy SMS':'Open Email \u2197';
  btn.className='sbtn '+(ch==='email'?'em':ch);
}
function sendMsg(){
  const m=buildMsg(mOrder,mTrigger);
  if(mCh==='wa')window.open('https://wa.me/'+(mOrder.phone||'').replace(/\D/g,'')+'?text='+encodeURIComponent(m),'_blank');
  else navigator.clipboard.writeText(m).then(()=>toast('Copied!'));
  closeModal();
}
function copyMsg(){navigator.clipboard.writeText(buildMsg(mOrder,mTrigger)).then(()=>toast('Copied!'));}
function closeModal(){document.getElementById('msgModal').classList.add('hidden');}

/* ═══ REMINDERS ═══ */
function remDue(o){
  if(o.type==='studio')return false;
  const se=o.subEvents&&o.subEvents[0];
  const evd=o.evdate||se?.evdate||'';
  if(!evd)return false;
  const days=Math.floor((new Date()-new Date(evd))/864e5);
  if(days<15)return false;
  if(o.smugShared&&o.pixShared)return false;
  if(!o.lastrem)return true;
  return Math.floor((new Date()-new Date(o.lastrem))/864e5)>=7;
}

function renderReminders(el){
  const due=orders.map((o,i)=>({o,i})).filter(({o})=>remDue(o));
  if(!due.length){el.innerHTML='<div class="empty"><div style="font-size:32px;opacity:.3">\u2705</div><h3>No reminders due</h3></div>';return;}
  el.innerHTML=due.map(({o,i})=>{
    const se=o.subEvents&&o.subEvents[0]||{};
    const evd=o.evdate||se.evdate||'';
    const days=evd?Math.floor((new Date()-new Date(evd))/864e5):0;
    return `<div class="oc" style="margin-bottom:10px">
      <div class="oct"><div>
        <div class="oc-id">${o.id}</div><div class="oc-name">${o.name||'\u2014'}</div>
        <div class="oc-meta">\ud83d\udcc5 ${evd} \u00b7 ${days} days ago</div>
      </div><span class="stb s-conf">\u23f0 Due</span></div>
      <div style="padding:8px 14px;font-size:12px;color:var(--t2);border-bottom:1px solid var(--br)">
        SmugMug: <b style="color:${o.smugShared?'var(--gn)':'var(--rd)'}">${o.smugShared?'\u2713':'\u2717'}</b> | 
        PixStudio: <b style="color:${o.pixShared?'var(--gn)':'var(--rd)'}">${o.pixShared?'\u2713':'\u2717'}</b> | 
        Sent: ${o.remCount||0}\u00d7
      </div>
      <div style="padding:8px 14px;display:flex;gap:6px">
        <button class="mb mb-g" onclick="markRem(${i})">\ud83d\udcf2 Send & Mark</button>
        <button class="mb mb-a" onclick="openMsg(orders[${i}],'reminder')">\ud83d\udc41 Preview</button>
      </div>
    </div>`;
  }).join('');
}
function markRem(idx){
  orders[idx].lastrem=new Date().toISOString().split('T')[0];
  orders[idx].remCount=(orders[idx].remCount||0)+1;
  localStorage.setItem(SK,JSON.stringify(orders));
  openMsg(orders[idx],'reminder');toast('Marked sent');renderApp();
}

function filterCards(){
  const q=(document.getElementById('srch')?.value||'').toLowerCase();
  const fm=(document.getElementById('fMonth')?.value||'').toLowerCase();
  const fs=document.getElementById('fStatus')?.value||'';
  const filtered=orders.filter(o=>{
    if(mode==='studio'&&o.type!=='studio')return false;
    if(mode==='event'&&o.type==='studio')return false;
    if(q&&!(o.name||'').toLowerCase().includes(q)&&!(o.id||'').toLowerCase().includes(q)&&
       !(o.venue||'').toLowerCase().includes(q)&&!(o.subEvents||[]).some(s=>(s.venue||'').toLowerCase().includes(q)))return false;
    if(fm&&(o.month||'').toLowerCase()!==fm)return false;
    if(fs&&o.status!==fs)return false;
    return true;
  });
  const el=document.getElementById('cardList');
  if(!filtered.length){el.innerHTML='<div class="empty"><div style="font-size:32px;opacity:.3">\ud83d\udcf7</div><h3>No orders found</h3></div>';return;}
  el.innerHTML=filtered.map(o=>o.type==='studio'?studioCard(o):eventCard(o)).join('');

function exportCSV(){
  const filtered=orders.filter(o=>mode==='studio'?o.type==='studio':o.type!=='studio');
  if(!filtered.length){toast('No orders');return;}
  const cols=mode==='studio'?['id','name','phone','odate','deldate','status','total']:
    ['id','name','phone','evdate','evtype','venue','reqs','quoted','discount','total','received','balance','status','photosCopied','nasCopied','smugShared','pixShared'];
  const header=cols.join(',');
  const rows=filtered.map(o=>cols.map(k=>{
    let v=o[k];
    if(k==='reqs')v=(o.reqs||[]).join('; ');
    if(k==='evdate'){const se=o.subEvents&&o.subEvents[0];v=o.evdate||se?.evdate||'';}
    if(k==='evtype'){const se=o.subEvents&&o.subEvents[0];v=se?.evtype||'';}
    if(k==='venue'){const se=o.subEvents&&o.subEvents[0];v=se?.venue||'';}
    return '"'+(v===undefined||v===null?'':v)+'"';
  }).join(','));
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([header+'\n'+rows.join('\n')],{type:'text/csv'}));
  a.download='tebo_'+mode+'_'+Date.now()+'.csv';a.click();toast('Exported!');
}

function getTeamReminders(){
  const now=new Date();const alerts=[];
  orders.forEach(o=>{
    if(o.type==='studio'||o.status==='Complete')return;
    const se=o.subEvents&&o.subEvents[0]||{};
    const evd=o.evdate||se.evdate||'';if(!evd)return;
    const daysTo=Math.ceil((new Date(evd+'T00:00')-now)/864e5);
    if(daysTo>0&&daysTo<=15&&daysTo%3===0)alerts.push({o,type:'team',daysTo});
    if(daysTo===1)alerts.push({o,type:'1day',daysTo});
    if(daysTo===0)alerts.push({o,type:'today',daysTo:0});
    if(daysTo<=-15&&!(o.smugShared&&o.pixShared)){
      const lr=o.lastrem?new Date(o.lastrem):null;
      if(!lr||Math.floor((now-lr)/864e5)>=7)alerts.push({o,type:'photo',daysTo:Math.abs(daysTo)});
    }
  });
  return alerts;
}

function getVendorAlerts(){
  const alerts=[];
  orders.forEach(o=>{
    if(o.type==='studio')return;
    const se=o.subEvents&&o.subEvents[0]||{};
    const evd=o.evdate||se.evdate||'';if(!evd)return;
    const days=Math.floor((new Date()-new Date(evd))/864e5);
    if(days<1)return;
    (o.teamMembers||[]).forEach(m=>{
      if(m.vendorAmt&&Number(m.vendorAmt)>0&&m.vendorStatus!=='Paid'&&days>=7)
        alerts.push({orderId:o.id,name:o.name,member:m.name,role:m.role,amt:m.vendorAmt,days});
    });
  });
  return alerts;
}

}
